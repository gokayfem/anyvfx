name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: tests, and bundles match their sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gokayfem/shader-skills
          ref: a936077bad8d4e6bdd9b1ee42a5b6bded1eb9643
          path: shader-skills
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends glslang-tools
      - name: Tools compile
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Bundled shaders match their sources
        env:
          SHADER_SKILLS: ${{ github.workspace }}/shader-skills
        run: |
          set -euo pipefail
          for d in examples/*/; do
            python tools/build.py "$d"
          done
          git status --porcelain -- examples
          git diff --exit-code -- examples
